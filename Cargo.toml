[package]
name = "at-world-matter"
version = "0.1.0"
edition = "2021"

[lib]
name = "at_matt_apk"
crate-type = ["cdylib"]

[dependencies]
eframe = "0.31.1"
winit = { version = "0.30", features = ["android-native-activity"] }
image = "0.25"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
activity = "android.app.NativeActivity"
package = "com.atmattapk.app"
name = "AT World Matter"

[package.metadata.android.permissions]
permissions = ["android.permission.WRITE_EXTERNAL_STORAGE", "android.permission.READ_EXTERNAL_STORAGE", "android.permission.INTERNET"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34
