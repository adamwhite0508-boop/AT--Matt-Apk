[package]
name = "at-world-matter"
version = "0.1.0"
edition = "2021"

[lib]
name = "at_world_matter"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Ye wala part hi takkar kara raha tha, isliye isko ek hi version pe lock kar diya
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
package = "com.atmattapk.app"
apk_name = "AT World Matter"

[package.metadata.android.sdk]
min_sdk_version = 21
target_sdk_version = 34
