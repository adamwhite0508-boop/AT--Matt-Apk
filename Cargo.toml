[package]
name = "at_world_matter"
version = "1.0.0"
edition = "2021"

[lib]
name = "at_world_matter"
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.27", features = ["default", "glow"] }
egui = "0.27"
winit = "0.29"
android-activity = { version = "0.5", features = ["native-activity"] }

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
