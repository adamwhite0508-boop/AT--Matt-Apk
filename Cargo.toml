[package]
name = "at_world_matter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.27.2", features = ["glow"] }
ndk-context = "0.1.1"
android-activity = { version = "0.5.2", features = ["native-activity", "game-activity"] }
ndk = "=0.8.0"
ndk-sys = "=0.5.0"

[package.metadata.android]
package = "com.atworld.matter"
build_targets = ["aarch64-linux-android"]
app_name = "AT World Matter"

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 33

[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"
