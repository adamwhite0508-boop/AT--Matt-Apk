[package]
name = "at-matt-apk"
version = "0.1.0"
edition = "2021"

[lib]
name = "at_matt_apk"
crate-type = ["cdylib", "rlib"]

[package.metadata.android]
platform = 33

[dependencies]
eframe = { version = "0.31.1", features = ["glow"] }
android-activity = { version = "0.6.1", features = ["game-activity"] }
android-logger = "0.5.0"
ndk = "0.9.0"
egui = "0.31.1"
winit = "0.30.9"
