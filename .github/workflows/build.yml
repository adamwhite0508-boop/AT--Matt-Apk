name: Build AAB - AT World Matter
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-aab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AAB with Docker
        run: |
          rm -rf .buildozer bin
          buildozer android debug

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-AAB
          path: bin/*.aab
          if-no-files-found: error
