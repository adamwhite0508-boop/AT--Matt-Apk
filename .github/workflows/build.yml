name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clean old build
        run: |
          rm -rf .buildozer bin
          sed -i '/android.archs/d' buildozer.spec
          sed -i '/android.api/d' buildozer.spec
          sed -i '/android.build_tools_version/d' buildozer.spec
          sed -i '/android.allow_backup/d' buildozer.spec
          echo "android.archs = arm64-v8a" >> buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.build_tools_version = 33.0.2" >> buildozer.spec
          grep -E "arch|api|build_tools" buildozer.spec

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable
          workdir: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-APK
          path: bin/*.apk
