name: Build APK
on: [push]

# YEH LINE SE 3 WALA PROBLEM KHATAM!
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip ant
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Accept Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Mater-APK
          path: bin/*.apk
