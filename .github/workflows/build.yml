name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install buildozer Cython==0.29.36
      - name: Build APK
        run: |
          # 1. Pehle sab delete
          rm -rf .buildozer bin ~/.buildozer
          
          # 2. Spec banao - NDK 28c rakho taaki download ka chakkar khatam
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT Matt Apk
          package.name = org.atmattapk
          package.domain = org.atmattapk
          source.dir = .
          version = 1.0
          requirements = python3==3.11.6,kivy==2.2.0
          orientation = portrait
          [buildozer]
          log_level = 1
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 28c
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          p4a.branch = master
          EOF

          # 3. License aur sdkmanager ka path fix
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea5a0b" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
          
          # 4. System ka sdkmanager copy karo taaki "sdkmanager does not exist" error khatam
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          cp -r $ANDROID_HOME/cmdline-tools/latest/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 5. Ab build
          python3.10 -m buildozer android debug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
