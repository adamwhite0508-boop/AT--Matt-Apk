name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clean ALL cache - IMPORTANT
        run: |
          rm -rf .buildozer bin buildozer.spec __pycache__
          rm -rf ~/.buildozer
          rm -rf /home/runner/.buildozer
          ls -la

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create buildozer.spec - SINGLE ARCH ONLY
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.2.0,kivymd==1.1.1,Pillow==9.5.0
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          bootstrap = sdl2
          p4a.branch = v2023.08.05
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.sdk = 33
          android.build_tools_version = 33.0.1
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          android.permissions = INTERNET
          p4a.fork = kivy
          p4a.local_recipes = 
          EOF
          echo "--- SPEC FILE ---"
          cat buildozer.spec

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer Cython==0.29.36

      - name: Setup Android SDK & NDK
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $SDK/cmdline-tools/latest
          cp -r cmdline-tools/* $SDK/cmdline-tools/latest/
          chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
          mkdir -p $SDK/tools/bin
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-33" "build-tools;33.0.1" || true
          PLAT=$HOME/.buildozer/android/platform
          mkdir -p $PLAT
          cd $PLAT
          if [ ! -d android-ndk-r25b ]; then wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip; unzip -q android-ndk-r25b-linux.zip; fi
          rm -rf android-ndk-r28c android-ndk-r25
          ln -s android-ndk-r25b android-ndk-r28c

      - name: Build APK - FORCE CLEAN
        run: |
          buildozer android clean
          buildozer android debug

      - name: List APK
        run: ls -lh bin/ || echo "No bin folder"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
          if-no-files-found: error
