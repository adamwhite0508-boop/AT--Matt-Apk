name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aidl build-essential libssl-dev libffi-dev python3-dev zlib1g-dev unzip
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Build APK - NDK 28c Fix
        run: |
          rm -rf bin buildozer.spec .buildozer
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools/latest/bin $SDK/licenses
          cp $ANDROID_HOME/cmdline-tools/latest/bin/* $SDK/cmdline-tools/latest/bin/ 2>/dev/null || true
          chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea3d97\n" > $SDK/licenses/android-sdk-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Pehle se build-tools, platform-tools, NDK 28c install - Ab download nahi hoga
          $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platform-tools" "platforms;android-33" "ndk;28.1.12479018" || true
          
          mkdir -p $SDK/tools/bin
          cat > $SDK/tools/bin/sdkmanager << 'WRAP'
          #!/bin/bash
          REAL="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ "$*" == *"platform-tools"* ]]; then echo "platform-tools already installed"; exit 0; fi
          ARGS=()
          for a in "$@"; do if [[ "$a" == --sdk_root=* ]]; then continue; fi; ARGS+=("$a"); done
          exec "$REAL" "${ARGS[@]}"
          WRAP
          chmod +x $SDK/tools/bin/sdkmanager
          
          cat > buildozer.spec << 'ENDSPEC'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,json,html,js,css
          version = 2.0
          requirements = python3,kivy==2.3.0,Pillow
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 28c
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a,armeabi-v7a
          android.permissions = INTERNET,CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          android.build_tools_version = 33.0.2
          p4a.bootstrap = sdl2
          p4a.branch = develop
          ENDSPEC
          
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
