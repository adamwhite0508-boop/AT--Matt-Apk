name: Build APK
on: [push]
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y zip unzip ant wget
          pip install --upgrade pip
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython==0.29.33
      - name: Build APK with 37->33 Hack
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools
          cd $SDK/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mkdir -p latest && mv cmdline-tools/* latest/ && rm -rf cmdline-tools tools.zip
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f101e5f7b998d5c1e3f5e3b0be3d8b9b7f7b7e" > $SDK/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c1051b8f1594b0" >> $SDK/licenses/android-sdk-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          # HACK: Copy 33.0.2 to 37.0.0 jisse Aidl mil jaye
          mkdir -p $SDK/build-tools
          cp -r $SDK/build-tools/33.0.2 $SDK/build-tools/37.0.0 || true
          ls $SDK/build-tools/
          # Ab buildozer chalao
          cd $GITHUB_WORKSPACE
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Mater-APK
          path: bin/*.apk
