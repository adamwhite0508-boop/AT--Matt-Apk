name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libbz2-dev libsqlite3-dev libncurses5-dev libltdl-dev libtool automake autoconf pkg-config zlib1g-dev libtinfo5 cmake
          sudo rm -rf /usr/bin/python3.14 /usr/local/bin/python3.14 || true
          sudo update-alternatives --install /usr/bin/python3 python3 /opt/hostedtoolcache/Python/3.10.22/x64/bin/python3.10 1
          sudo update-alternatives --set python3 /opt/hostedtoolcache/Python/3.10.22/x64/bin/python3.10
          /opt/hostedtoolcache/Python/3.10.22/x64/bin/python -m pip install --upgrade pip==24.0
          /opt/hostedtoolcache/Python/3.10.22/x64/bin/python -m pip install buildozer cython==0.29.36
          # Accept Android Licenses
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55\n d56f5187479451eabf01fb78af6dfcb131a6481e\n 24333f8a63b6825ea9c5514f83c1059b8ea731e4" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          yes | /opt/hostedtoolcache/Python/3.10.22/x64/bin/python -m pip install buildozer || true
      - name: Build APK
        run: |
          export PATH=/opt/hostedtoolcache/Python/3.10.22/x64/bin:$PATH
          yes | python3 -m buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
