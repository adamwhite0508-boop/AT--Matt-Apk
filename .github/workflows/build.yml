name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Pre-install and Link SDK
        run: |
          SDK=$ANDROID_HOME
          mkdir -p $SDK/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > $SDK/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b2db" > $SDK/licenses/android-sdk-preview-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "platforms;android-35" "platform-tools" "ndk;25.1.8937393"
          # --- YEH SABSE IMPORTANT HAI ---
          # Buildozer ke SDK ko System SDK se link karo
          mkdir -p /home/runner/.buildozer/android/platform
          rm -rf /home/runner/.buildozer/android/platform/android-sdk
          ln -sfn $SDK /home/runner/.buildozer/android/platform/android-sdk
          ls /home/runner/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl
          echo "Link done"

      - name: Build APK
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer
          pip install --force-reinstall --no-deps https://github.com/kivy/python-for-android/archive/master.zip
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
