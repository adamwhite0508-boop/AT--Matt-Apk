name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y zip unzip libffi-dev libssl-dev libbz2-dev libsqlite3-dev libncurses5-dev libltdl-dev libtool automake autoconf pkg-config zlib1g-dev cmake liblzo2-dev || true
      - name: Kill Python 3.14 and Force 3.10
        run: |
          python3.10 --version
          sudo rm -rf /opt/hostedtoolcache/Python/3.14* || true
          sudo ln -sf /opt/hostedtoolcache/Python/3.10.18/x64/bin/python3.10 /usr/bin/python3.10 || true
          sudo ln -sf /opt/hostedtoolcache/Python/3.10.18/x64/bin/python3.10 /usr/bin/python3 || true
          sudo ln -sf /opt/hostedtoolcache/Python/3.10.18/x64/bin/python /opt/hostedtoolcache/Python/3.10.18/x64/bin/python3 || true
          python --version
          python3 --version
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip==24.0
          python -m pip install buildozer cython==0.29.36
      - name: Build APK
        run: |
          rm -rf .buildozer
          python -m buildozer -v android debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: bin/*.apk
