name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clean
        run: rm -rf bin .buildozer buildozer.spec

      - name: Install
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aidl build-essential libssl-dev libffi-dev python3-dev zlib1g-dev unzip wget
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Build APK
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm -rf $SDK/cmdline-tools
          mkdir -p $SDK/cmdline-tools/latest
          cp -r cmdline-tools/* $SDK/cmdline-tools/latest/
          chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "ndk;25.1.8937393" > /dev/null 2>&1 || true
          mkdir -p $SDK/tools/bin
          printf '#!/bin/bash\nREAL="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"\nif [[ "$*" == *"--list"* ]]; then echo "  build-tools;33.0.2"; exit 0; fi\nARGS=(); for a in "$@"; do [[ "$a" == --sdk_root=* ]] && continue; ARGS+=("$a"); done\nexec "$REAL" "${ARGS[@]}"\n' > $SDK/tools/bin/sdkmanager
          chmod +x $SDK/tools/bin/sdkmanager
          cd $GITHUB_WORKSPACE
          cat > buildozer.spec << 'SPEC'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,json
          version = 2.0
          requirements = python3,kivy,Pillow
          orientation = portrait
          [buildozer]
          log_level = 1
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          android.permissions = INTERNET
          SPEC
          buildozer android debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APK
          path: bin/*.apk
