name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget libffi-dev libssl-dev
          pip install buildozer Cython==0.29.36

      - name: Make spec
        run: |
          rm -f buildozer.spec
          echo "[app]" > buildozer.spec
          echo "title = AT World Matter" >> buildozer.spec
          echo "package.name = atworldmatter" >> buildozer.spec
          echo "package.domain = com.anuj.atworldmatter" >> buildozer.spec
          echo "source.dir = ." >> buildozer.spec
          echo "source.include_exts = py,png,jpg,kv,atlas" >> buildozer.spec
          echo "version = 6.0" >> buildozer.spec
          echo "requirements = python3,kivy==2.3.0,kivymd==1.1.1,pillow,plyer,android" >> buildozer.spec
          echo "orientation = portrait" >> buildozer.spec
          echo "" >> buildozer.spec
          echo "[buildozer]" >> buildozer.spec
          echo "log_level = 2" >> buildozer.spec
          echo "" >> buildozer.spec
          echo "[app:android]" >> buildozer.spec
          echo "bootstrap = sdl2" >> buildozer.spec
          echo "android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,CAMERA,RECORD_AUDIO" >> buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          echo "android.sdk = 33" >> buildozer.spec
          echo "android.build_tools_version = 33.0.1" >> buildozer.spec
          echo "android.accept_sdk_license_agreement = True" >> buildozer.spec
          echo "android.archs = arm64-v8a, armeabi-v7a" >> buildozer.spec
          echo "p4a.branch = v2024.01.21" >> buildozer.spec
          cat buildozer.spec

      - name: Setup SDK Fix
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools
          mkdir -p $SDK/tools/bin
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "24333f8a4f788a98278d7be218930e8097c8f5b" >> $SDK/licenses/android-sdk-license
          cd /tmp
          rm -rf cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $SDK/cmdline-tools/latest
          mv cmdline-tools/* $SDK/cmdline-tools/latest/ || true
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
          ls -lh $SDK/tools/bin/sdkmanager
          $SDK/cmdline-tools/latest/bin/sdkmanager --version || true

      - name: Build APK
        run: |
          rm -rf bin
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
