name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean everything
        run: |
          rm -rf .buildozer bin buildozer.spec
          rm -rf ~/.buildozer/android/platform/build-*
          echo "CLEANED"

      - name: Create spec (bash - no python error)
        run: |
          cat > buildozer.spec << 'ENDOFFILE'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,kivymd==1.1.1,pillow
          orientation = portrait
          [buildozer]
          log_level = 1
          [app:android]
          bootstrap = sdl2
          p4a.branch = v2023.08.05
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.sdk = 33
          android.build_tools_version = 33.0.1
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          android.permissions = INTERNET
          ENDOFFILE
          cat buildozer.spec
          grep archs buildozer.spec

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget libffi-dev libssl-dev
          pip install buildozer Cython==0.29.36

      - name: Pre-install SDK
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_ROOT/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$SDK_ROOT/licenses/android-sdk-license"
          cd /tmp
          rm -rf cmdline-tools commandlinetools-linux-11076708_latest.zip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -r cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          chmod +x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.1" || true
          PLAT="$HOME/.buildozer/android/platform"
          mkdir -p "$PLAT"
          cd "$PLAT"
          if [ ! -d "android-ndk-r25b" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q android-ndk-r25b-linux.zip
          fi
          rm -rf android-ndk-r28c
          ln -s android-ndk-r25b android-ndk-r28c
          rm -rf "$PLAT/build-arm64-v8a_armeabi-v7a" "$PLAT/build-armeabi-v7a" "$HOME/.buildozer/android/app"

      - name: Build APK
        run: |
          rm -rf bin .buildozer/android/platform/build-* .buildozer/android/app
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
