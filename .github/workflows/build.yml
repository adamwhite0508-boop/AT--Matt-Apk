name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clean old cache + Install Deps
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip
          pip install buildozer cython==0.29.33

      - name: Fix - Install BOTH 33 and 37 Build-Tools
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          SM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SM --licenses || true
          # Dono install karo taaki Aidl mil jaye, chahe 33 maange ya 37
          yes | $SM "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" "platforms;android-34" "platform-tools" || true
          
          # Buildozer ka fake sdkmanager fix
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
          ln -sf $SM ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          # License force
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "y" > /tmp/l && cp /tmp/l ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          
          # Aidl ke liye copy - Yahi se error aa raha tha
          cp -r $ANDROID_HOME/build-tools/33.0.2 ~/.buildozer/android/platform/android-sdk/build-tools/ || true
          cp -r $ANDROID_HOME/build-tools/37.0.0 ~/.buildozer/android/platform/android-sdk/build-tools/ || true
          ls ~/.buildozer/android/platform/android-sdk/build-tools/
          ls ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl
          ls ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl || true

      - name: Build AAB
        run: buildozer android debug

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Mater-AAB
          path: bin/*.aab
