name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Buildozer
        run: |
          pip install buildozer cython==0.29.33

      - name: Accept Licenses & Build
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android debug || true
          export SDK="$HOME/.buildozer/android/platform/android-sdk"
          yes | $SDK/cmdline-tools/bin/sdkmanager --licenses || true
          yes | $SDK/cmdline-tools/*/bin/sdkmanager --licenses || true
          ls $SDK/cmdline-tools/ -R
          find $HOME/.buildozer -name sdkmanager -type f | xargs -I{} sh -c 'yes | {} --licenses || true'
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
