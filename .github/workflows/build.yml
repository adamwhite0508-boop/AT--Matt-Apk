name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install and Build
        run: |
          rm -rf .buildozer bin ~/.buildozer
          sudo apt update
          sudo apt install -y build-essential libltdl-dev python3-dev libffi-dev libssl-dev unzip wget libsqlite3-dev
          pip install Cython==0.29.33 buildozer
          mkdir -p ~/.buildozer/android/platform/
          cd /tmp && wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip && unzip -q ndk.zip -d ~/.buildozer/android/platform/
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools && cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          rm -rf $SDK_DIR/cmdline-tools && mkdir -p $SDK_DIR/cmdline-tools/latest
          unzip -q cmdline.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/ || mv /tmp/cmd/* $SDK_DIR/cmdline-tools/latest/ || true
          mkdir -p $SDK_DIR/tools/bin ~/.android/licenses $SDK_DIR/licenses
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c38d3246ff25be\nd975f751698a77b662f1254ddbeed3901e976f5a\n601085b94cdba5280d1fbc2a5d303f32a37a3d9b\n" > $SDK_DIR/licenses/android-sdk-license
          cp $SDK_DIR/licenses/* ~/.android/licenses/ || true
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platforms;android-33" "platform-tools" || true
          cd $GITHUB_WORKSPACE
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with: {name: AT-World-APK, path: bin/*.apk}
