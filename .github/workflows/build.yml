name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install buildozer Cython==0.29.36
      - name: FORCE Single Arch Build
        run: |
          rm -rf .buildozer bin
          rm -rf ~/.buildozer
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT Matt Apk
          package.name = org.atmattapk
          package.domain = org.atmattapk
          source.dir = .
          version = 1.0
          requirements = hostpython3==3.11.6,python3==3.11.6,kivy==2.2.0
          orientation = portrait
          [buildozer]
          log_level = 1
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          android.build_tools_version = 33.0.2
          android.archs = arm64-v8a
          p4a.branch = 2024.1.21
          p4a.bootstrap = sdl2
          EOF
          cat buildozer.spec
      - name: Pre-setup SDK for Single Arch
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25.1.8937393"
          mkdir -p ~/.buildozer/android/platform/
          ln -sf $ANDROID_HOME/ndk/25.1.8937393 ~/.buildozer/android/platform/android-ndk-r25b || true
      - name: Build APK
        run: |
          python3.10 -m buildozer android debug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
