name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Fix sdkmanager path and licenses
        run: |
          SDK1=$ANDROID_HOME
          SDK2=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p $SDK1/licenses
          mkdir -p $SDK2/licenses
          mkdir -p $SDK2/tools/bin
          ln -sf $SDK1/cmdline-tools/latest/bin/sdkmanager $SDK2/tools/bin/sdkmanager || true
          # 2 licenses chahiye - yahi main galti thi
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > $SDK1/licenses/android-sdk-license
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > $SDK2/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b2db" > $SDK1/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b2db" > $SDK2/licenses/android-sdk-preview-license
          # force accept
          yes | $SDK1/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $SDK1/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" || true
          cat $SDK2/licenses/android-sdk-license
          ls -l $SDK2/build-tools/ || echo "no build-tools yet - will be installed by buildozer"

      - name: Build APK
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer
          pip install --force-reinstall --no-deps https://github.com/kivy/python-for-android/archive/master.zip
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
