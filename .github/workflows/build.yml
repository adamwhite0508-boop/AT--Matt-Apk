      - name: Fix SDK
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "24333f8a4f788a98278d7be218930e8097c8f5b" >> $SDK/licenses/android-sdk-license
          
          # Naya cmdline-tools download
          mkdir -p $SDK/cmdline-tools
          cd /tmp
          rm -rf cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm -rf $SDK/cmdline-tools/latest
          mkdir -p $SDK/cmdline-tools/latest
          mv cmdline-tools/* $SDK/cmdline-tools/latest/
          chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
          
          # YAHI ASLI FIX HAI - Wrapper banao, copy nahi!
          mkdir -p $SDK/tools/bin
          cat > $SDK/tools/bin/sdkmanager << EOF
          #!/bin/bash
          exec $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "\$@"
          EOF
          chmod +x $SDK/tools/bin/sdkmanager
          
          # License accept
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-33" "build-tools;33.0.1" || true
          
          echo "SDK FIXED WITH WRAPPER!"
          ls -lh $SDK/tools/bin/sdkmanager
          cat $SDK/tools/bin/sdkmanager
