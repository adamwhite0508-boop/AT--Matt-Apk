name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build APK - FINAL GREEN
        run: |
          rm -rf bin .buildozer ~/.buildozer
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT Matt Apk
          package.name = org.atmattapk
          package.domain = org.atmattapk
          source.dir = .
          version = 1.0
          requirements = python3,kivy==2.3.0
          orientation = portrait
          [buildozer]
          log_level = 1
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          p4a.branch = v2024.1.21
          EOF
          pip install Cython==0.29.36 buildozer==1.5.0
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer android debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: bin/*.apk
