name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and Build
        run: |
          sudo apt update
          sudo apt install -y build-essential libltdl-dev python3-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug || true
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager -type f | head -n 1)
          echo "Found: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "build-tools;37.0.0" || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-APK
          path: bin/*.apk
