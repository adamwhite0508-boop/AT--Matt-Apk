name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}

      - name: Build APK Direct
        run: |
          rm -rf .buildozer bin build dist
          rm -rf $HOME/.buildozer $HOME/.android
          
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip build-essential libssl-dev libffi-dev autoconf libtool pkg-config zlib1g-dev cmake
          pip install --upgrade pip
          pip install Cython==0.29.36
          pip install python-for-android==2024.1.21
          
          # SDK Setup - p4a ke liye sahi jagah pe
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools $HOME/.android
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          chmod +x $ANDROID_HOME/cmdline-tools/latest/bin/*
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses 2>/dev/null || mkdir -p $ANDROID_HOME/licenses && echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "y" | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25.1.8937393"
          
          cd $GITHUB_WORKSPACE
          # ASLI BUILD - No Buildozer, Only p4a - arm64 ONLY, No armv7a
          p4a apk --private . --package=com.atworld.app --name="AT World" --version 0.1 --bootstrap=sdl2 --arch=arm64-v8a --requirements=python3,kivy==2.3.0 --sdk-dir $ANDROID_HOME --ndk-dir $ANDROID_HOME/ndk/25.1.8937393 --api=33 --ndk-api=24 --dist-name=atworld --copy-libs --debug
          
          mkdir -p bin
          cp -r dist/atworld/bin/*.apk bin/ || cp dist/*/bin/*.apk bin/ || find dist -name "*.apk" -exec cp {} bin/ \;
          ls -lh bin/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT-World-APK
          path: bin/*.apk
