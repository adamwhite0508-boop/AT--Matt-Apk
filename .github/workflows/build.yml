name: build
on:
  push:
    branches: [ main ]
jobs:
  Build-APK---CLEAN-FINAL:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          sudo apt update && sudo apt install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libbz2-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
          rm -rf .buildozer bin
          export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROIDSDK/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d $ANDROIDSDK/cmdline-tools
          mv $ANDROIDSDK/cmdline-tools/cmdline-tools $ANDROIDSDK/cmdline-tools/latest
          mkdir -p $ANDROIDSDK/tools/bin
          echo -e "#!/bin/bash\nexec \$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \"\$@\"" > $ANDROIDSDK/tools/bin/sdkmanager
          chmod +x $ANDROIDSDK/tools/bin/sdkmanager
          yes | $ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager --licenses
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          source.include_patterns = logo.png,icon.png
          version = 1.0
          requirements = python3,kivy==2.3.1
          orientation = portrait
          icon.filename = %(source.dir)s/icon.png
          presplash.filename = %(source.dir)s/logo.png
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 27c
          android.sdk = 33
          android.archs = arm64-v8a
          android.accept_sdk_license_agreement = True
          p4a.branch = master
          android.permissions = INTERNET
          EOF
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
