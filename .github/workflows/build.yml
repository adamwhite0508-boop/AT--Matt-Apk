name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and Build
        run: |
          sudo apt update
          sudo apt install -y build-essential libltdl-dev python3-dev libffi-dev libssl-dev
          pip install buildozer Cython==0.29.33
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          sed -i '/^android.api/d' buildozer.spec; sed -i '/^android.minapi/d' buildozer.spec; sed -i '/android.build_tools/d' buildozer.spec; sed -i '/^log_level/d' buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          echo "android.build_tools_version = 37.0.0" >> buildozer.spec
          echo "log_level = 2" >> buildozer.spec
          buildozer android debug || true
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          CMDLINE=$SDK_DIR/cmdline-tools/latest/bin/sdkmanager
          if [ ! -f "$CMDLINE" ]; then CMDLINE=$(find $SDK_DIR -name sdkmanager | head -n 1); fi
          chmod +x $CMDLINE || true
          mkdir -p $SDK_DIR/licenses
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c38d3246ff25be
          d975f751698a77b662f1254ddbeed3901e976f5a" > $SDK_DIR/licenses/android-sdk-license
          cp $SDK_DIR/licenses/android-sdk-license ~/.android/licenses/ || true
          echo "y" > /tmp/yes.txt; for i in $(seq 1 100); do echo "y" >> /tmp/yes.txt; done
          cat /tmp/yes.txt | $CMDLINE --licenses > /dev/null 2>&1 || true
          cat /tmp/yes.txt | $CMDLINE --install "build-tools;37.0.0" "platforms;android-33" "platform-tools" > /dev/null 2>&1 || true
          echo "Installed:"
          ls $SDK_DIR/build-tools/ || echo "No build-tools yet, trying again"
          cat /tmp/yes.txt | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --install "build-tools;37.0.0" || true
          ls $SDK_DIR/build-tools/ || true
          find $SDK_DIR -name aidl || true
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: AT-World-APK
          path: bin/*.apk
