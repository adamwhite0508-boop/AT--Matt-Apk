name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clean
        run: rm -rf .buildozer bin buildozer.spec ~/.buildozer /home/runner/.buildozer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create spec - SINGLE ARCH FORCED
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.2.0,kivymd==1.1.1,Pillow==9.5.0
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          bootstrap = sdl2
          p4a.branch = v2023.08.05
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.sdk = 33
          android.build_tools_version = 33.0.1
          android.accept_sdk_license_agreement = True
          android.arch = arm64-v8a
          android.archs = arm64-v8a
          android.permissions = INTERNET
          EOF
          cat buildozer.spec
          echo "--- Checking arch line ---"
          grep -i arch buildozer.spec

      - name: Install and PATCH Buildozer to single arch
        run: |
          pip install buildozer Cython==0.29.36
          # Patch default.spec so it never uses armeabi-v7a
          find /opt/hostedtoolcache -name "default.spec" 2>/dev/null -exec sed -i 's/armeabi-v7a//g; s/arm64-v8a, ,/arm64-v8a/g; s/, ,/,/g' {} \; || true
          find /opt/hostedtoolcache -name "default.spec" -exec cat {} \; | grep arch || true

      - name: Setup SDK NDK
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $SDK/cmdline-tools/latest
          cp -r cmdline-tools/* $SDK/cmdline-tools/latest/
          chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
          mkdir -p $SDK/tools/bin
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-33" "build-tools;33.0.1" || true
          PLAT=$HOME/.buildozer/android/platform
          mkdir -p $PLAT
          cd $PLAT
          if [ ! -d android-ndk-r25b ]; then wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip; unzip -q android-ndk-r25b-linux.zip; fi
          rm -rf android-ndk-r28c
          ln -s android-ndk-r25b android-ndk-r28c

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
          if-no-files-found: error
