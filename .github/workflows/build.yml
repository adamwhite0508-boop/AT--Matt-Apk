name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer
        run: |
          pip install buildozer cython==0.29.33
          sudo apt-get update && sudo apt-get install -y libffi-dev libssl-dev

      - name: Pre-Install Android SDK for Buildozer
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;37.0.0" "platforms;android-33" "platform-tools"
          mkdir -p $HOME/.buildozer/android/platform/android-sdk
          cp -r $ANDROID_HOME/build-tools $HOME/.buildozer/android/platform/android-sdk/ || true
          cp -r $ANDROID_HOME/platforms $HOME/.buildozer/android/platform/android-sdk/ || true
          cp -r $ANDROID_HOME/platform-tools $HOME/.buildozer/android/platform/android-sdk/ || true
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_HOME/licenses/* $HOME/.buildozer/android/platform/android-sdk/licenses/ || true
          # Fake sdkmanager jo kabhi fail nahi hoga
          echo '#!/bin/bash
          if [[ "$*" == *"platform-tools"* ]]; then
            echo "Skipping platform-tools - already installed"
            exit 0
          fi
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"
          exit 0' > $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

      - name: Build AAB - AT World Matter
        run: |
          buildozer android release --verbose

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-AAB
          path: bin/*.aab
