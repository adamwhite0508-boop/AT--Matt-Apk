name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Clean old Buildozer cache
        run: rm -rf ~/.buildozer

      - name: Install dependencies & Force Accept Licenses
        run: |
          pip install --upgrade buildozer cython
          sudo apt-get update
          sudo apt-get install -y aidl
          # Accept all licenses in main SDK
          yes | sdkmanager --licenses || true
          # Pre-create licenses for Buildozer's own SDK path
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p $ANDROID_HOME/licenses
          # Copy all license hashes (this fixes 37.0.0)
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55a071bae62" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051b8ea0e4e4ee" > $ANDROID_HOME/licenses/android-sdk-preview-license
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true
          # Pre-install 36.0.0 only
          yes | sdkmanager "build-tools;36.0.0" "platforms;android-33" "platform-tools" || true

      - name: Build APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: bin/*.apk
