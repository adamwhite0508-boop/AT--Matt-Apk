name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install buildozer Cython==0.29.36 Kivy==2.2.0
      - name: Accept licenses and install SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25.2.9519653"
      - name: Build APK
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer/android/platform
          ln -sf $ANDROID_HOME/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25b
          ln -sf $ANDROID_HOME/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r28c
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -s $ANDROID_HOME/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools
          ln -s $ANDROID_HOME/build-tools ~/.buildozer/android/platform/android-sdk/build-tools
          ln -s $ANDROID_HOME/platforms ~/.buildozer/android/platform/android-sdk/platforms
          ln -s $ANDROID_HOME/platform-tools ~/.buildozer/android/platform/android-sdk/platform-tools
          ln -s $ANDROID_HOME/ndk/25.2.9519653 ~/.buildozer/android/platform/android-sdk/ndk-bundle
          mkdir -p ~/.buildozer/android/platform/android-sdk/ndk
          ln -s $ANDROID_HOME/ndk/25.2.9519653 ~/.buildozer/android/platform/android-sdk/ndk/25b
          printf '#!/bin/bash\nexec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"\n' > ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          python3.10 -m buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
