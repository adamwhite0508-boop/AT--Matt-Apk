name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
      - name: Pre-install and Link SDK
        run: |
          SDK=$ANDROID_HOME
          mkdir -p $SDK/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > $SDK/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b2db" > $SDK/licenses/android-sdk-preview-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" "ndk;25.1.8937393"
          mkdir -p $SDK/tools/bin
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          mkdir -p /home/runner/.buildozer/android/platform
          rm -rf /home/runner/.buildozer/android/platform/android-sdk
          ln -sfn $SDK /home/runner/.buildozer/android/platform/android-sdk
      - name: Build APK
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.33" "buildozer==1.5.0"
          buildozer android debug --verbose > build.log 2>&1 || true
          echo "========== LAST 500 LINES OF ERROR =========="
          tail -n 500 build.log
          if ! ls bin/*.apk 1> /dev/null 2>&1; then echo "BUILD FAILED"; exit 1; fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
