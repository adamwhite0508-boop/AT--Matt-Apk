name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/user/hostcwd kivy/buildozer:master sh -c "cd /home/user/hostcwd && buildozer android debug"
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
