name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget
          pip install buildozer==1.5.0 cython==0.29.36

      - name: FORCE Create buildozer.spec
        run: |
          rm -f buildozer.spec
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.anuj.atworldmatter
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.5
          requirements = python3,kivy==2.3.0,kivymd==1.1.1,androidstorage4kivy
          orientation = portrait
          fullscreen = 0
          [buildozer]
          log_level = 2
          [app:android]
          android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          p4a.bootstrap = sdl2
          EOF

      - name: Fix sdkmanager path - MANUAL INSTALL
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "24333f8a4f788a98278d7be218930e8097c8f5b" >> $SDK/licenses/android-sdk-license
          
          # Pehle se cmdline-tools download karo
          mkdir -p $SDK/cmdline-tools
          cd /tmp
          rm -rf cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm -rf $SDK/cmdline-tools/latest
          mkdir -p $SDK/cmdline-tools/latest
          mv cmdline-tools/* $SDK/cmdline-tools/latest/
          chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
          
          # Ab purane raste pe bhi bana do - Yahi Buildozer dhoondh raha hai!
          mkdir -p $SDK/tools/bin
          cp $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          chmod +x $SDK/tools/bin/sdkmanager
          cp -r $SDK/cmdline-tools/latest/lib $SDK/tools/ 2>/dev/null || true
          
          # License accept
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "build-tools;33.0.2" "platform-tools" "platforms;android-33" || true
          
          ls -lh $SDK/tools/bin/sdkmanager
          echo "SDK FIXED!"

      - name: Build APK
        run: |
          rm -rf bin
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
