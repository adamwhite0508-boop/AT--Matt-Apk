name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}

      - name: Install and Build
        run: |
          set -x
          rm -rf .buildozer bin
          sudo apt update
          sudo apt install -y build-essential libltdl-dev libffi-dev libssl-dev libbz2-dev libsqlite3-dev unzip wget zlib1g-dev libncurses5-dev
          
          # === STEP 1: PYTHON FIX (Cython/setuptools error ka permanent fix) ===
          pip install --upgrade pip
          pip install "setuptools<81" "packaging==23.2" "wheel" Cython==0.29.36 buildozer

          # === STEP 2: SPEC FIX (archs dual ka fix) ===
          sed -i 's/^android.archs.*/android.archs = arm64-v8a/' buildozer.spec || echo "android.archs = arm64-v8a" >> buildozer.spec
          grep -q "android.ndk" buildozer.spec || echo "android.ndk = 25b" >> buildozer.spec
          grep -q "android.sdk" buildozer.spec || echo "android.sdk = 33" >> buildozer.spec
          sed -i 's/^android.build_tools_version.*/android.build_tools_version = 37.0.0/' buildozer.spec || echo "android.build_tools_version = 37.0.0" >> buildozer.spec
          grep -q "p4a.branch" buildozer.spec || echo "p4a.branch = develop" >> buildozer.spec
          grep -q "accept_sdk" buildozer.spec || echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
          grep -q "log_level" buildozer.spec || echo "log_level = 2" >> buildozer.spec
          cat buildozer.spec | grep android

          PLATFORM=$HOME/.buildozer/android/platform
          mkdir -p $PLATFORM
          cd /tmp

          # === STEP 3: NDK FIX (r28c ko r25b banana) ===
          if [ ! -d "$PLATFORM/android-ndk-r28c" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
            unzip -q ndk.zip
            rm -rf $PLATFORM/android-ndk-r25b $PLATFORM/android-ndk-r28c
            mv android-ndk-r25b $PLATFORM/android-ndk-r25b
            cp -r $PLATFORM/android-ndk-r25b $PLATFORM/android-ndk-r28c
            echo "NDK FIXED"
          fi

          # === STEP 4: SDK + AIDL FIX (Aidl not found ka permanent fix) ===
          SDK=$PLATFORM/android-sdk
          mkdir -p $SDK/cmdline-tools/latest $SDK/tools/bin ~/.android/licenses $SDK/licenses
          if [ ! -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
            unzip -q cmd.zip -d /tmp/cmd_tmp
            mv /tmp/cmd_tmp/cmdline-tools/* $SDK/cmdline-tools/latest/ 2>/dev/null || mv /tmp/cmd_tmp/* $SDK/cmdline-tools/latest/ 2>/dev/null || true
            ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          fi

          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c38d3246ff25be" >> $SDK/licenses/android-sdk-license
          cp $SDK/licenses/* ~/.android/licenses/ 2>/dev/null || true
          
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Aage ke saare build-tools install - jo bhi p4a maange mil jayega
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "build-tools;37.0.0" "build-tools;34.0.0" "build-tools;33.0.1" "platforms;android-33" "platforms;android-34" "platform-tools" || true
          
          # AIDL check
          ls $SDK/build-tools/37.0.0/aidl || ls $SDK/build-tools/34.0.0/aidl || echo "AIDL STILL MISSING"

          # === STEP 5: BUILD ===
          cd $GITHUB_WORKSPACE
          buildozer android debug || (echo "=== BUILD FAILED - SHOWING LAST 200 LINES ===" && tail -n 200 ~/.buildozer/logs/* 2>/dev/null || true && cat .buildozer/logs/buildozer.log 2>/dev/null | tail -n 200 || true && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT-World-APK
          path: |
            bin/*.apk
            .buildozer/logs/
