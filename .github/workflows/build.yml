name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build APK
        run: |
          set -e
          rm -rf .buildozer bin __pycache__
          
          # Fix spec - only 1 arch
          sed -i '/android.archs/d' buildozer.spec || true
          sed -i '/android.api/d' buildozer.spec || true
          sed -i '/android.minapi/d' buildozer.spec || true
          sed -i '/android.ndk/d' buildozer.spec || true
          sed -i '/p4a.bootstrap/d' buildozer.spec || true
          echo "android.archs = arm64-v8a" >> buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          echo "p4a.bootstrap = sdl2" >> buildozer.spec
          grep -E "arch|api|bootstrap" buildozer.spec

          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo6 cmake libffi-dev libssl-dev libltdl-dev libbz2-dev libsqlite3-dev

          pip install --upgrade pip
          pip install --upgrade Cython==0.29.33 buildozer==1.5.0 python-for-android

          # LICENSE ACCEPT - AUTO
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c38d3246ff25be" >> ~/.android/licenses/android-sdk-license

          buildozer android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-APK
          path: bin/*.apk
