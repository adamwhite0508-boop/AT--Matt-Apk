name: Build AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build as non-root
        run: |
          rm -rf .buildozer bin
          # Permission fix
          chown -R 1000:1000 .
          # Run as normal user, not root
          su -c "buildozer android debug" user
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-AAB
          path: bin/*.aab
