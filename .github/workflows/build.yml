name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}

      - name: Install and Build
        run: |
          set -e
          rm -rf .buildozer bin
          
          # Sirf ek arch
          sed -i '/android.archs/d' buildozer.spec
          sed -i '/\[app\]/a android.archs = arm64-v8a' buildozer.spec
          cat buildozer.spec | grep -A2 -B2 arch
          
          sudo apt update
          sudo apt install -y python3-pip build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libltdl-dev libffi-dev libssl-dev libbz2-dev libsqlite3-dev
          
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer==1.5.0
          
          yes | buildozer android debug || true
          # Dusri baar me ban jata hai
          buildozer android debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT-World-APK
          path: bin/*.apk
