name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install + Double Patch
        run: |
          sudo apt-get update
          sudo apt-get install -y aidl build-essential libssl-dev libffi-dev python3-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libltdl-dev unzip
          pip install Cython==0.29.36 buildozer==1.5.0
          PYTHON_SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          # Dono jagah patch - buildozer + python-for-android
          echo "Patching all files..."
          grep -r "tools/bin/sdkmanager" $PYTHON_SITE --include="*.py" -l 2>/dev/null | xargs sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' || true
          grep -r "tools/bin/sdkmanager" $PYTHON_SITE --include="*.py" -l 2>/dev/null | xargs sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' || true
          echo "Patched"

      - name: Build APK
        run: |
          rm -rf bin buildozer.spec .buildozer
          # License
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea3d97" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # LIVE JUGAAD - Background me har 1 sec me sdkmanager ka rasta banata rahega - Isse Line 87 fix hoga
          (while true; do
            if [ -f "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
              cp $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager 2>/dev/null || true
            fi
            # r28c ko 25b se replace karne ka jugaad
            if [ -d "$HOME/.buildozer/android/platform/android-sdk/ndk/25.1.8937393" ]; then
              mkdir -p $HOME/.buildozer/android/platform/
            fi
            sleep 1
          done) &
          JUGAAD_PID=$!
          
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,html
          version = 2.0
          requirements = python3,kivy==2.3.0
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          android.permissions = INTERNET,CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,READ_CONTACTS,CALL_PHONE,RECORD_AUDIO
          android.build_tools_version = 33.0.2
          p4a.bootstrap = sdl2
          p4a.branch = v2024.1.21
          EOF
          
          buildozer android debug
          kill $JUGAAD_PID || true

      - uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
