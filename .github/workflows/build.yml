name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget libffi-dev libssl-dev
          pip install buildozer Cython==0.29.36

      - name: Make spec
        run: |
          rm -f buildozer.spec
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.anuj.atworldmatter
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 6.0
          requirements = python3,kivy==2.3.0,kivymd==1.1.1,pillow,plyer,android
          orientation = portrait

          [buildozer]
          log_level = 2

          [app:android]
          bootstrap = sdl2
          android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,CAMERA,RECORD_AUDIO
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a, armeabi-v7a
          p4a.branch = master
          EOF

      - name: Build APK
        run: |
          rm -rf bin .buildozer
          buildozer android debug

      - name: Upload APK
        uses: actions/upload
