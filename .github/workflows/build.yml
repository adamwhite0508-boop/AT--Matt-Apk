name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK - SdkManagerCli Fix
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.2
          ndk-version: 25b

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aidl build-essential libssl-dev libffi-dev python3-dev
          pip install Cython==0.29.36 buildozer==1.5.0
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" || true

      - name: Build APK
        run: |
          rm -rf bin buildozer.spec
          # Buildozer ko bolo SDK pehle se hai - Tools wala bug skip
          mkdir -p ~/.buildozer/android/platform/android-sdk
          ln -sf $ANDROID_SDK_ROOT/* ~/.buildozer/android/platform/android-sdk/ 2>/dev/null || true
          cp -r $ANDROID_SDK_ROOT/* ~/.buildozer/android/platform/android-sdk/ 2>/dev/null || true
          
          cat > buildozer.spec << 'ENDSPEC'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,json,html,js,css
          version = 2.0
          requirements = python3,kivy==2.3.0,Pillow
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a,armeabi-v7a
          android.permissions = INTERNET,CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          android.build_tools_version = 33.0.2
          p4a.bootstrap = sdl2
          p4a.branch = develop
          ENDSPEC
          
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
