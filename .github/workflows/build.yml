name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip
          pip install buildozer cython==0.29.33

      - name: Fix SDK Path - sdkmanager not found
        run: |
          SM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          echo "System SDK at: $ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/latest/bin/
          
          # 1. Buildozer ka SDK folder banao - SAHI JAGAH PE
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/platform-tools
          
          # 2. System wale binaries ko Buildozer wale me copy/link karo
          ln -sf $SM ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager
          ln -sf $ANDROID_HOME/platform-tools/adb ~/.buildozer/android/platform/android-sdk/platform-tools/adb || true
          
          # 3. Purana wala tools/bin bhi banao (p4a purana path bhi check karta hai)
          echo "#!/bin/bash" > ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          echo "exec $SM \"\$@\"" >> ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          touch ~/.buildozer/android/platform/android-sdk/tools/bin/android
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/android
          
          # 4. License accept
          yes | $SM --licenses || true
          yes | $SM "build-tools;33.0.2" "platforms;android-33" || true
          
          # 5. Verify
          ls -l ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
          ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Build AAB
        run: buildozer android debug

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Mater-AAB
          path: bin/*.aab
