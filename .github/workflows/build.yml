name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          sudo apt-get update && sudo apt-get install -y libffi-dev libssl-dev
      - name: Accept All Licenses & Install Build-Tools 37
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "build-tools;37.0.0" "platforms;android-33" "platform-tools"
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_HOME/licenses/* /home/runner/.buildozer/android/platform/android-sdk/licenses/ || true
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools
          cp -r $ANDROID_HOME/build-tools/37.0.0 /home/runner/.buildozer/android/platform/android-sdk/build-tools/ || true
          cp -r $ANDROID_HOME/build-tools/34.0.0 /home/runner/.buildozer/android/platform/android-sdk/build-tools/ || true
      - name: Build AAB - AT World Matter
        run: |
          buildozer android release
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-AAB
          path: bin/*.aab
