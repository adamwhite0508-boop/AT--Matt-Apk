name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install and Build
        run: |
          rm -rf .buildozer bin ~/.buildozer
          sudo apt update
          sudo apt install -y build-essential libltdl-dev libffi-dev libssl-dev unzip wget
          pip install --upgrade pip
          pip install "setuptools<81" Cython==0.29.36 buildozer
          
          # === FORCE SINGLE ARCH ===
          sed -i '/android.archs/d' buildozer.spec
          echo "android.archs = arm64-v8a" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          echo "android.sdk = 33" >> buildozer.spec
          echo "android.build_tools_version = 37.0.0" >> buildozer.spec
          echo "p4a.branch = develop" >> buildozer.spec
          echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
          echo "log_level = 2" >> buildozer.spec
          echo "--- CHECK ARCH ---"
          cat buildozer.spec | grep archs
          
          PLATFORM=$HOME/.buildozer/android/platform
          mkdir -p $PLATFORM
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
          unzip -q ndk.zip
          rm -rf $PLATFORM/android-ndk-r25b $PLATFORM/android-ndk-r28c
          mv android-ndk-r25b $PLATFORM/android-ndk-r25b
          cp -r $PLATFORM/android-ndk-r25b $PLATFORM/android-ndk-r28c
          
          SDK=$PLATFORM/android-sdk
          mkdir -p $SDK/cmdline-tools/latest $SDK/tools/bin ~/.android/licenses $SDK/licenses
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip -d /tmp/cmd_tmp
          mv /tmp/cmd_tmp/cmdline-tools/* $SDK/cmdline-tools/latest/ 2>/dev/null || mv /tmp/cmd_tmp/* $SDK/cmdline-tools/latest/ 2>/dev/null || true
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c38d3246ff25be" >> $SDK/licenses/android-sdk-license
          cp $SDK/licenses/* ~/.android/licenses/ 2>/dev/null || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "build-tools;37.0.0" "platforms;android-33" "platform-tools" || true
          
          cd $GITHUB_WORKSPACE
          buildozer android debug
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT-World-APK
          path: bin/*.apk
