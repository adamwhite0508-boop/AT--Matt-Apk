name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget build-essential libffi-dev libssl-dev
          pip install --upgrade buildozer cython==0.29.36 pillow
      - name: Build APK
        run: |
          rm -rf .buildozer bin
          export SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT
          
          # SDK ko haath se download karo - ab find fail nahi hoga
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/ || true
          mkdir -p $SDK_ROOT/tools/bin
          cp $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $SDK_ROOT/tools/bin/sdkmanager -f
          cp -r $SDK_ROOT/cmdline-tools/latest/lib $SDK_ROOT/tools/ || true
          chmod +x $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          chmod +x $SDK_ROOT/tools/bin/sdkmanager
          
          # License banao
          mkdir -p $SDK_ROOT/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a4f788a98278d7be218930e8097c8f5b" >> $SDK_ROOT/licenses/android-sdk-license
          
          SDKMANAGER=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --sdk_root=$SDK_ROOT --licenses || true
          yes | $SDKMANAGER --sdk_root=$SDK_ROOT "build-tools;37.0.0" "platform-tools" "platforms;android-33" || true
          
          cd $GITHUB_WORKSPACE
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
