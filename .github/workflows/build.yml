name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Build APK - CLEAN FINAL
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer==1.5.0
          sudo apt update && sudo apt install -y zip unzip
          rm -rf .buildozer bin
          export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROIDSDK/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d $ANDROIDSDK/cmdline-tools
          mv $ANDROIDSDK/cmdline-tools/cmdline-tools $ANDROIDSDK/cmdline-tools/latest
          mkdir -p $ANDROIDSDK/tools/bin
          echo -e "#!/bin/bash\nexec \$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \"\$@\"" > $ANDROIDSDK/tools/bin/sdkmanager
          chmod +x $ANDROIDSDK/tools/bin/sdkmanager
          yes | $ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy==2.3.0,kivymd==1.1.1,Pillow
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.archs = arm64-v8a
          android.accept_sdk_license_agreement = True
          EOF
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
