name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build APK
        run: |
          pip install --upgrade pip
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip
          pip install cython==0.29.33
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev libgl1-mesa-dev
          
          # sdkmanager ka nakli rasta banao
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
          
          # license accept karo
          mkdir -p $ANDROID_HOME/licenses $HOME/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" | tee $ANDROID_HOME/licenses/android-sdk-license $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license > /dev/null
          yes | sdkmanager --licenses || true
          
          # 37.0.0 install karo taaki aidl mil jaye
          sdkmanager "build-tools;37.0.0" "build-tools;35.0.0" "platforms;android-35" "platform-tools" || true
          
          # ab build karo
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-Final-APK
          path: bin/*.apk
