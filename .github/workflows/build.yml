name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget libffi-dev libssl-dev
          pip install buildozer Cython==0.29.36

      - name: Make spec
        shell: python
        run: |
          import pathlib, shutil, textwrap
          shutil.rmtree(".buildozer", ignore_errors=True)
          shutil.rmtree("bin", ignore_errors=True)
          pathlib.Path("buildozer.spec").unlink(missing_ok=True)
          spec = textwrap.dedent('''
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.anuj.atworldmatter
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 6.0
          requirements = python3,kivy==2.3.0,kivymd==1.1.1,pillow
          orientation = portrait
          [buildozer]
          log_level = 1
          [app:android]
          bootstrap = sdl2
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.sdk = 33
          android.build_tools_version = 33.0.1
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          p4a.branch = v2023.08.05
          ''')
          pathlib.Path("buildozer.spec").write_text(spec)
          print(spec)

      - name: Pre-install SDK
        shell: python
        run: |
          import os, subprocess, pathlib
          home = os.path.expanduser("~")
          sdk_root = pathlib.Path(home) / ".buildozer/android/platform/android-sdk"
          sdk_root.mkdir(parents=True, exist_ok=True)
          (sdk_root / "licenses").mkdir(parents=True, exist_ok=True)
          (sdk_root / "licenses" / "android-sdk-license").write_text("8933bad161af4178b1185d1a37fbf41ea5269c55\n")
          os.chdir("/tmp")
          subprocess.run("rm -rf cmdline-tools", shell=True)
          subprocess.run("wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip", shell=True)
          subprocess.run("unzip -q commandlinetools-linux-11076708_latest.zip", shell=True)
          latest_dir = sdk_root / "cmdline-tools" / "latest"
          latest_dir.mkdir(parents=True, exist_ok=True)
          subprocess.run("cp -r /tmp/cmdline-tools/* " + str(latest_dir) + "/", shell=True)
          bin_path = latest_dir / "bin" / "sdkmanager"
          subprocess.run("chmod +x " + str(bin_path), shell=True)
          tools_bin = sdk_root / "tools" / "bin"
          tools_bin.mkdir(parents=True, exist_ok=True)
          target = tools_bin / "sdkmanager"
          if target.exists() or target.is_symlink():
              target.unlink()
          target.symlink_to(bin_path)
          srs = str(sdk_root)
          lbs = str(bin_path)
          subprocess.run("yes | " + lbs + " --sdk_root=" + srs + " --licenses || true", shell=True)
          subprocess.run("yes | " + lbs + " --sdk_root=" + srs + " 'platform-tools' 'platforms;android-33' 'build-tools;33.0.1' || true", shell=True)
          pd = pathlib.Path(home) / ".buildozer/android/platform"
          pd.mkdir(parents=True, exist_ok=True)
          os.chdir(str(pd))
          ndk_25 = pd / "android-ndk-r25b"
          if not ndk_25.exists():
              subprocess.run("wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip", shell=True)
              subprocess.run("unzip -q android-ndk-r25b-linux.zip", shell=True)
          r28c = pd / "android-ndk-r28c"
          r25b = pd / "android-ndk-r25b"
          if r28c.exists() or r28c.is_symlink():
              subprocess.run("rm -rf " + str(r28c), shell=True)
          subprocess.run("ln -s " + str(r25b) + " " + str(r28c), shell=True)
          # FORCE DELETE OLD DUAL BUILD FOLDER
          subprocess.run("rm -rf " + str(pd / "build-arm64-v8a_armeabi-v7a") + " " + str(pd / "build-armeabi-v7a") + " " + str(pd / "build-arm64-v8a"), shell=True)
          subprocess.run("rm -rf " + str(pathlib.Path(home) / ".buildozer/android/app"), shell=True)

      - name: Build APK
        run: |
          rm -rf bin
          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/app
          cat buildozer.spec | grep -A2 archs
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
