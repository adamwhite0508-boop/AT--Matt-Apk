name: Build AAB - AT World Matter
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Clean Old Cache - IMPORTANT
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.cache

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          sudo apt update
          sudo apt install -y libffi-dev libssl-dev autoconf automake libtool

      - name: Build AAB Debug
        run: |
          yes | buildozer android debug --verbose

      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: AT-World-Matter-AAB
          path: bin/*.aab
