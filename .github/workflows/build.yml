name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip
          pip install buildozer cython==0.29.33

      - name: FIX sdkmanager Path (Main Error)
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          # Create fake sdkmanager that points to real one
          echo '#!/bin/bash' > ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          echo 'exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"' >> ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          # License accept
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b044" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          cp ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license $ANDROID_HOME/licenses/ || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build AAB
        run: buildozer android debug

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Mater-AAB
          path: bin/*.aab
