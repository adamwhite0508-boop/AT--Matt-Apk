name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Clean old cache
        run: rm -rf ~/.buildozer

      - name: Install deps & Fix sdkmanager path
        run: |
          pip install --upgrade buildozer cython
          sudo apt-get update
          sudo apt-get install -y aidl
          # Fix: Buildozer looks for old path tools/bin/sdkmanager
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          # Copy real sdkmanager to that old path
          cp $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/ || cp $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          cp $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/ || true
          # Accept licenses
          yes | sdkmanager --licenses || true
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Build APK
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: bin/*.apk
