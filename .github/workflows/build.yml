name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip
          pip install buildozer cython==0.29.33
      
      - name: Fix Buildozer Spec & Licenses
        run: |
          sed -i "s/^android.api.*/android.api = 33/" buildozer.spec || true
          sed -i "s/^android.build_tools_version.*/android.build_tools_version = 33.0.2/" buildozer.spec || true
          echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true
      
      - name: Build AAB
        run: buildozer android debug
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Mater-AAB
          path: bin/*.aab
