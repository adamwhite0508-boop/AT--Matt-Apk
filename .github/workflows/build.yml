name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libffi-dev libssl-dev libbz2-dev libsqlite3-dev libncurses5-dev libltdl-dev libtool automake autoconf pkg-config zlib1g-dev cmake liblzo2-dev
      - name: FORCE Python 3.10
        run: |
          sudo rm -rf /opt/hostedtoolcache/Python/3.14* || true
          python3.10 --version
          python3 --version
      - name: Install buildozer with FIXED p4a
        run: |
          python3.10 -m pip install --upgrade pip==23.3.1
          python3.10 -m pip install buildozer cython==0.29.36
          python3.10 -m pip install --upgrade git+https://github.com/kivy/python-for-android.git@develop
      - name: Build APK
        run: |
          rm -rf .buildozer bin
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea04e4f" >> ~/.android/licenses/android-sdk-license
          yes | python3.10 -m buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
