name: Build APK
on: [push]
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          # Root check ko permanently disable karo
          BUILD_FILE=$(find / -name "__init__.py" -path "*buildozer/__init__.py" 2>/dev/null | head -1)
          echo "Patching $BUILD_FILE"
          sed -i 's/def check_root(self):/def check_root(self):\n        return\n    def check_root_old(self):/' $BUILD_FILE || true
          # Spec me warn_on_root = 0 karo
          sed -i 's/warn_on_root = 1/warn_on_root = 0/g' buildozer.spec
          sed -i 's/warn_on_root=1/warn_on_root=0/g' buildozer.spec
          cat buildozer.spec | grep warn
          # Ab build karo
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Mater-APK
          path: bin/*.apk
