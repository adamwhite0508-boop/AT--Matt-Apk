name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
        
      - name: Build
        run: |
          rm -rf .buildozer bin buildozer.spec
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World
          package.name = atworld
          package.domain = com.atworld.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.archs = arm64-v8a
          android.api = 33
          android.minapi = 24
          android.ndk = 28c
          android.sdk = 33
          android.accept_sdk_license_agreements = True
          p4a.bootstrap = sdl2
          EOF
          
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip build-essential libssl-dev libffi-dev python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libbz2-dev libltdl-dev
          pip install Cython==0.29.36 buildozer==1.5.0
          
          # Buildozer ka andar ka rasta fix karo - yehi main fix hai
          SITE=$(python3 -c "import os, buildozer; print(os.path.dirname(buildozer.__file__))")
          echo "Patching $SITE/targets/android.py"
          sed -i 's|tools/bin/sdkmanager|cmdline-tools/latest/bin/sdkmanager|g' $SITE/targets/android.py || true
          grep -n "sdkmanager" $SITE/targets/android.py | head -20
          
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools $HOME/.android/licenses $SDK/licenses $SDK/tools/bin
          
          cd /tmp
          rm -rf cmdline-tools cmd.zip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip
          rm -rf $SDK/cmdline-tools/latest
          mkdir -p $SDK/cmdline-tools/latest
          mv cmdline-tools/* $SDK/cmdline-tools/latest/
          chmod +x $SDK/cmdline-tools/latest/bin/*
          
          # Dono raste pe sdkmanager banao
          cp $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          cp $SDK/cmdline-tools/latest/bin/avdmanager $SDK/tools/bin/avdmanager || true
          chmod +x $SDK/tools/bin/*
          ls -lh $SDK/tools/bin/sdkmanager $SDK/cmdline-tools/latest/bin/sdkmanager
          
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/licenses/android-sdk-license
          cp $HOME/.android/licenses/android-sdk-license $SDK/licenses/
          
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools" || true
          
          cd $GITHUB_WORKSPACE
          buildozer android debug
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT-World-APK
          path: bin/*.apk
