name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aidl + Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y aidl build-essential libssl-dev libffi-dev python3-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libltdl-dev unzip
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Build APK
        run: |
          rm -rf bin buildozer.spec
          # 1. SDK ka rasta banao + License accept
          export SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/licenses
          mkdir -p $SDK_DIR/cmdline-tools/latest/bin
          mkdir -p $SDK_DIR/tools/bin
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_DIR/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea3d97" >> $SDK_DIR/licenses/android-sdk-license
          echo "y" > $SDK_DIR/licenses/android-sdk-preview-license
          # 2. System wala sdkmanager copy karo taki Line 95 wala error na aaye
          cp $ANDROID_HOME/cmdline-tools/latest/bin/* $SDK_DIR/cmdline-tools/latest/bin/ || true
          cp $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/ || true
          # 3. Pehle se hi saare packages install karo - Taki buildozer dubara r28c download na kare
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --install "build-tools;37.0.0" "build-tools;33.0.2" "platform-tools" "platforms;android-33" "ndk;25.1.8937393" || true
          # 4. NDK 25b ko r28c ke naam se copy karo - Taki buildozer samjhe r28c hai hi (Jugaad)
          if [ -d "$SDK_DIR/ndk/25.1.8937393" ]; then
            mkdir -p $HOME/.buildozer/android/platform/
            cp -r $SDK_DIR/ndk/25.1.8937393 $HOME/.buildozer/android/platform/android-ndk-r25b || true
          fi

          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,html
          version = 2.0
          requirements = python3,kivy==2.3.0,kivymd==1.1.1,pillow,plyer,android,pyjnius
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          android.permissions = INTERNET,CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,READ_CONTACTS,CALL_PHONE,RECORD_AUDIO
          android.build_tools_version = 37.0.0
          p4a.bootstrap = sdl2
          EOF
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
