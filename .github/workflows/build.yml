name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Clean NDK
        run: rm -rf $HOME/.buildozer || true

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Force Correct Build-Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "build-tools;34.0.0" "platforms;android-33" "platforms;android-34" "platform-tools" "ndk;25b"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ls $ANDROID_HOME/build-tools/

      - name: Install libs
        run: |
          sudo apt update
          sudo apt install -y zip unzip git openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer Cython==0.29.36

      - name: Build APK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          cp -rv $ANDROID_HOME/cmdline-tools/latest/bin/* ~/.buildozer/android/platform/android-sdk/tools/bin/ || true
          cp -rv $ANDROID_HOME/cmdline-tools/latest/lib ~/.buildozer/android/platform/android-sdk/tools/ || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/
          cp -rv $ANDROID_HOME/build-tools/* ~/.buildozer/android/platform/android-sdk/build-tools/ || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/platform-tools/
          cp -rv $ANDROID_HOME/platform-tools/* ~/.buildozer/android/platform/android-sdk/platform-tools/ || true
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
