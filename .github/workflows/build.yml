name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}

      - name: Install and Build
        run: |
          set -e
          rm -rf .buildozer bin
          
          sed -i '/android.archs/d' buildozer.spec
          sed -i '/\[app\]/a android.archs = arm64-v8a' buildozer.spec
          echo "=== ARCH ===" 
          grep arch buildozer.spec
          
          sudo apt update
          sudo apt install -y git zip unzip build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev libltdl-dev
          
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer==1.5.0
          
          buildozer android debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT-World-APK
          path: bin/*.apk
