name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Aggressive Clean - Force delete r28c
        run: |
          rm -rf .buildozer bin
          sudo rm -rf /home/runner/.buildozer
          sudo rm -rf ~/.buildozer
          sudo rm -rf /root/.buildozer || true
          mkdir -p ~/.buildozer
          echo "Cache Cleaned - No more r28c"

      - name: Verify spec
        run: cat buildozer.spec | grep android

      - name: Build APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
          if-no-files-found: warn
