name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget libffi-dev libssl-dev
          pip install buildozer Cython==0.29.36

      - name: Make spec
        shell: python
        run: |
          import pathlib, shutil
          shutil.rmtree(".buildozer", ignore_errors=True)
          shutil.rmtree("bin", ignore_errors=True)
          spec = """[app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.anuj.atworldmatter
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 6.0
          requirements = python3,kivy==2.3.0,kivymd==1.1.1,pillow,plyer,android
          orientation = portrait
          [buildozer]
          log_level = 1
          [app:android]
          bootstrap = sdl2
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.build_tools_version = 33.0.1
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          p4a.branch = v2023.08.05
          """
          pathlib.Path("buildozer.spec").write_text(spec)
          print(spec)

      - name: Pre-install SDK
        shell: python
        run: |
          import os, subprocess, pathlib
          home = os.path.expanduser("~")
          sdk_root = pathlib.Path(home) / ".buildozer/android/platform/android-sdk"
          sdk_root.mkdir(parents=True, exist_ok=True)
          (sdk_root / "licenses").mkdir(parents=True, exist_ok=True)
          (sdk_root / "licenses" / "android-sdk-license").write_text("8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a4f788a98278d7be218930e8097c8f5b\n")
          os.chdir("/tmp")
          subprocess.run("rm -rf cmdline-tools", shell=True)
          subprocess.run("wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip", shell=True)
          subprocess.run("unzip -q commandlinetools-linux-11076708_latest.zip", shell=True)
          (sdk_root / "cmdline-tools" / "latest").mkdir(parents=True, exist_ok=True)
          subprocess.run(f"cp -r /tmp/cmdline-tools/* {sdk_root}/cmdline-tools/latest/", shell=True)
          subprocess.run(f"chmod +x {sdk_root}/cmdline-tools/latest/bin/s
