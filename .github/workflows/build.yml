name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aidl build-essential libssl-dev libffi-dev python3-dev zlib1g-dev unzip wget
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Build APK - Google Tools Fix
        run: |
          rm -rf bin buildozer.spec .buildozer
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          
          # GOOGLE SE NAYA cmdline-tools DOWNLOAD - $ANDROID_HOME pe depend nahi
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm -rf $SDK/cmdline-tools
          mkdir -p $SDK/cmdline-tools/latest
          cp -r cmdline-tools/* $SDK/cmdline-tools/latest/
          chmod +x $SDK/cmdline-tools/latest/bin/sdkmanager
          ls -lh $SDK/cmdline-tools/latest/bin/sdkmanager
          ls -lh $SDK/cmdline-tools/latest/lib/ | head -5
          
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea3d97\n" > $SDK/licenses/android-sdk-license
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platform-tools" "platforms;android-33" "ndk;28.1.12479018" || true
          
          # Wrapper - Jo --sdk_root hatayega
          mkdir -p $SDK/tools/bin
          cat > $SDK/tools/bin/sdkmanager << 'WRAP'
          #!/bin/bash
          REAL="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          ARGS=()
          for a in "$@"; do [[ "$a" == --sdk_root=* ]] && continue; ARGS+=("$a"); done
          exec "$REAL" "${ARGS[@]}"
          WRAP
          chmod +x $SDK/tools/bin/sdkmanager
          
          echo "=== SELF TEST - Yahi Line 122 pe fail ho raha tha ==="
          $SDK/tools/bin/sdkmanager --sdk_root=$SDK --list | head -20
          echo "=== SELF TEST PASSED - Ab 40s wala khatam ==="
          
          cd $GITHUB_WORKSPACE
          cat > buildozer.spec << 'ENDSPEC'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,json,html,js,css
          version = 2.0
          requirements = python3,kivy==2.3.0,Pillow
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 28c
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a,armeabi-v7a
          android.permissions = INTERNET,CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          android.build_tools_version = 33.0.2
          p4a.bootstrap = sdl2
          p4a.branch = develop
          ENDSPEC
          
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: bin/*.apk
