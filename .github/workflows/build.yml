name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aidl build-essential libssl-dev libffi-dev python3-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev cmake libltdl-dev unzip libbz2-dev libreadline-dev libsqlite3-dev
          pip install --upgrade pip
          pip install Cython==0.29.36 buildozer==1.5.0

      - name: Build APK
        run: |
          rm -rf bin buildozer.spec .buildozer/logs
          # License - Pehle se
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea3d97" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          cat > buildozer.spec << 'EOF'
          [app]
          title = AT World Matter
          package.name = atworldmatter
          package.domain = com.atworldmatter.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,html
          version = 2.0
          requirements = python3,kivy==2.3.0
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          android.archs = arm64-v8a
          android.permissions = INTERNET,CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,READ_CONTACTS,CALL_PHONE,RECORD_AUDIO
          android.build_tools_version = 33.0.2
          p4a.bootstrap = sdl2
          p4a.branch = v2024.1.21
          EOF
          
          # Build karo - Fail hua to pura log dikhao
          buildozer android debug || (echo "=== FULL LOG ===" && cat .buildozer/logs/buildozer.log && exit 1)

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AT-World-Matter-APK
          path: |
            bin/*.apk
            .buildozer/logs/*
