name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.14'

      - name: KILL Python 3.14 - FORCE 3.10
        run: |
          sudo rm -rf /opt/hostedtoolcache/Python/3.14*
          sudo rm -rf /opt/hostedtoolcache/Python/3.12*
          sudo rm -rf /opt/hostedtoolcache/Python/3.11*
          sudo rm -f /usr/bin/python3.14 /usr/local/bin/python3.14
          which python
          python --version
          sudo ln -sf $(which python) /usr/bin/python3
          sudo ln -sf $(which python) /usr/bin/python
          python3 --version
          python3 -m pip --version

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libffi-dev libssl-dev libbz2-dev libsqlite3-dev libncurses5-dev libltdl-dev libtool automake autoconf pkg-config zlib1g-dev cmake liblzo2-dev

      - name: Install buildozer FIXED
        run: |
          python3 -m pip install --upgrade pip==23.3.1
          python3 -m pip install buildozer cython==0.29.36
          python3 -m pip install git+https://github.com/kivy/python-for-android.git@develop

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          python3 -m buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
